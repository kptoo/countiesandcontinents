<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Kenya Counties &amp; World Continents</title>
<meta name="description" content="Interactive map of Kenya's 47 counties and the world's continents, built with Leaflet." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="map"></div>

  <div id="loading">Loading map data&hellip;</div>

  <header id="masthead">
    <span class="mark"></span>
    <h1>Kenya Counties <span class="joiner">&times;</span> World Continents</h1>
  </header>

  <div id="focus-stack" class="hidden">
    <div id="prayer-banner" class="hidden" aria-live="polite">
      <span class="prayer-lead">Praying for</span>
      <span id="prayer-name" class="prayer-name"></span>
    </div>
    <div id="verse-banner" class="hidden" aria-live="polite">
      <p id="verse-text"></p>
    </div>
  </div>

  <section id="layers-panel" aria-label="Layer controls">
    <label class="layer-row">
      <input type="checkbox" id="toggle-counties" checked />
      <span class="swatch swatch-counties"></span>
      <span class="layer-name">Kenya counties</span>
      <span class="layer-count" id="count-counties"></span>
    </label>
    <label class="layer-row">
      <input type="checkbox" id="toggle-continents" checked />
      <span class="swatch swatch-continents"></span>
      <span class="layer-name">World continents</span>
      <span class="layer-count" id="count-continents"></span>
    </label>

    <div class="divider"></div>
    <button type="button" class="list-toggle-btn" id="open-counties-list">Browse all counties</button>
    <button type="button" class="list-toggle-btn" id="open-continents-list">Browse all continents</button>

    <div class="divider"></div>
    <label class="layer-row">
      <input type="checkbox" id="toggle-prayer" checked />
      <span class="swatch swatch-prayer"></span>
      <span class="layer-name">Prayer banner</span>
    </label>
    <label class="jump-row">
      <span class="jump-label">Edit anytime — clicking a region fills this in</span>
      <input type="text" id="prayer-input" placeholder="e.g. Bomet county" />
    </label>

    <div class="divider"></div>
    <label class="jump-row">
      <span class="jump-label">Bible verse — shown live as you type</span>
      <textarea id="verse-input" rows="3" placeholder="e.g. Philippians 4:6&#10;Be anxious for nothing…"></textarea>
    </label>
  </section>

  <div class="list-panel hidden" id="counties-panel">
    <div class="list-panel-header">
      <span class="list-panel-drag" title="Drag to move">&vellip;&vellip;</span>
      <span class="list-panel-title">Counties</span>
      <span class="font-size-controls">
        <button type="button" class="font-btn" data-panel="counties-panel" data-delta="-1" aria-label="Smaller text">A&minus;</button>
        <button type="button" class="font-btn" data-panel="counties-panel" data-delta="1" aria-label="Larger text">A+</button>
      </span>
      <button type="button" class="list-panel-close" data-panel="counties-panel" aria-label="Close list">&times;</button>
    </div>
    <ul id="counties-list" class="feature-list"></ul>
  </div>

  <div class="list-panel hidden" id="continents-panel">
    <div class="list-panel-header">
      <span class="list-panel-drag" title="Drag to move">&vellip;&vellip;</span>
      <span class="list-panel-title">Continents</span>
      <span class="font-size-controls">
        <button type="button" class="font-btn" data-panel="continents-panel" data-delta="-1" aria-label="Smaller text">A&minus;</button>
        <button type="button" class="font-btn" data-panel="continents-panel" data-delta="1" aria-label="Larger text">A+</button>
      </span>
      <button type="button" class="list-panel-close" data-panel="continents-panel" aria-label="Close list">&times;</button>
    </div>
    <ul id="continents-list" class="feature-list"></ul>
  </div>

  <aside id="detail-panel" class="hidden" aria-live="polite">
    <button id="panel-close" aria-label="Close">&times;</button>
    <p class="detail-kicker" id="detail-kicker">County</p>
    <h2 id="detail-title"></h2>
    <dl id="detail-stats"></dl>
  </aside>

  <p id="hint">Click a county or continent to begin praying for it</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
